<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Библиотека{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f9fafb;
            color: #1f2937;
            line-height: 1.6;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header {
            background: #ffffff;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
        }
        nav a {
            color: #2563eb;
            text-decoration: none;
            margin-right: 20px;
            font-weight: 600;
        }
        nav a:hover { text-decoration: underline; }
        h1 { margin-bottom: 20px; }
        h2 { margin-bottom: 12px; }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06);
        }
        .card a { color: #2563eb; text-decoration: none; font-weight: 600; }
        .card a:hover { text-decoration: underline; }
        .meta { color: #6b7280; font-size: .9rem; margin-top: 4px; }
        .empty {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            color: #6b7280;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
        dl { display: grid; grid-template-columns: 160px 1fr; gap: 8px 16px; }
        dt { font-weight: 600; color: #6b7280; }
        dd { color: #1f2937; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <a href="{% url 'library:book_list' %}">📚 Книги</a>
                <a href="{% url 'library:author_list' %}">👤 Авторы</a>
                <a href="{% url 'library:about' %}">ℹ️ О библиотеке</a>
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
